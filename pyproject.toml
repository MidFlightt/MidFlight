[project]
name = "midflight"
version = "0.1.0"
description = "Keeps a small team's coding agents aligned while they work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "mcp>=2.3.0",
    "pydantic>=2.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette suggests httpx2 for its TestClient; httpx works and is what we pin.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The standard-library prototype; deleted once S-3 lands.
extend-exclude = ["midflight/__main__.py", "midflight/claims.py", "tests/test_claims.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["midflight", "demo_fixture"]
