<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" width="1120" height="1000" role="img" aria-label="Midflight UML use case diagram">
  <title>Midflight use cases</title>
  <style>
    .bg{fill:#ffffff}
    .bound{fill:none;stroke:#18222b;stroke-width:1.5}
    .band{stroke:#d5dcdf;stroke-width:1;stroke-dasharray:4 4}
    .bandlbl{font:10.5px Consolas,"IBM Plex Mono",monospace;letter-spacing:.1em;fill:#56636e}
    .sys{font:700 18px "Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em;fill:#18222b}
    .assoc{stroke:#18222b;stroke-width:1.1;fill:none;opacity:.75}
    .dep{stroke:#0d5c73;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
    .deplbl{font:10.5px Consolas,"IBM Plex Mono",monospace;fill:#0d5c73}
    .uc{fill:#ffffff;stroke:#18222b;stroke-width:1.3}
    .int{fill:#e2eff3;stroke:#0d5c73;stroke-width:1.3}
    .ucid{font:10px Consolas,"IBM Plex Mono",monospace;fill:#56636e}
    .ucname{font:500 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#18222b}
    .fig{stroke:#18222b;stroke-width:1.6;fill:none}
    .alabel{font:600 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#18222b}
    .stereo{font:10px Consolas,"IBM Plex Mono",monospace;fill:#56636e}
    .arrowhead{fill:none;stroke:#0d5c73;stroke-width:1.4}
  </style>
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="1000"/>

  <!-- system boundary -->
  <rect class="bound" x="200" y="20" width="700" height="960" rx="6"/>
  <text class="sys" x="884" y="48" text-anchor="end">MIDFLIGHT</text>
  <line class="band" x1="200" y1="372" x2="900" y2="372"/>
  <line class="band" x1="200" y1="772" x2="900" y2="772"/>
  <text class="bandlbl" x="216" y="84">PLAN &amp; OVERSIGHT</text>
  <text class="bandlbl" x="216" y="392">AGENT WORK</text>
  <text class="bandlbl" x="216" y="800">VERIFY</text>

  <!-- associations -->
  <line class="assoc" x1="124" y1="200" x2="295" y2="120"/>
  <line class="assoc" x1="124" y1="200" x2="295" y2="185"/>
  <line class="assoc" x1="124" y1="200" x2="295" y2="250"/>
  <line class="assoc" x1="124" y1="200" x2="295" y2="315"/>
  <line class="assoc" x1="124" y1="445" x2="295" y2="425"/>
  <line class="assoc" x1="124" y1="445" x2="295" y2="485"/>
  <line class="assoc" x1="124" y1="625" x2="295" y2="485"/>
  <line class="assoc" x1="124" y1="625" x2="295" y2="545"/>
  <line class="assoc" x1="124" y1="625" x2="295" y2="605"/>
  <line class="assoc" x1="124" y1="625" x2="295" y2="665"/>
  <line class="assoc" x1="124" y1="625" x2="295" y2="725"/>
  <line class="assoc" x1="986" y1="690" x2="805" y2="560"/>
  <line class="assoc" x1="986" y1="690" x2="805" y2="845"/>
  <line class="assoc" x1="986" y1="880" x2="805" y2="845"/>
  <line class="assoc" x1="986" y1="880" x2="805" y2="930"/>

  <!-- include / extend -->
  <line class="dep" x1="505" y1="185" x2="594" y2="185" marker-end="url(#oa)"/>
  <text class="deplbl" x="549" y="176" text-anchor="middle">«include»</text>
  <line class="dep" x1="505" y1="545" x2="594" y2="556" marker-end="url(#oa)"/>
  <text class="deplbl" x="549" y="539" text-anchor="middle">«include»</text>
  <line class="dep" x1="505" y1="605" x2="619" y2="578" marker-end="url(#oa)"/>
  <text class="deplbl" x="572" y="610" text-anchor="middle">«include»</text>
  <line class="dep" x1="700" y1="654" x2="700" y2="587" marker-end="url(#oa)"/>
  <text class="deplbl" x="710" y="624">«extend»</text>
  <line class="dep" x1="700" y1="706" x2="700" y2="818" marker-end="url(#oa)"/>
  <text class="deplbl" x="710" y="796">«extend»</text>
  <line class="dep" x1="505" y1="845" x2="594" y2="845" marker-end="url(#oa)"/>
  <text class="deplbl" x="549" y="836" text-anchor="middle">«extend»</text>
  <line class="dep" x1="700" y1="871" x2="700" y2="903" marker-end="url(#oa)"/>
  <text class="deplbl" x="710" y="892">«include»</text>

  <!-- use cases: column A -->
  <ellipse class="uc" cx="400" cy="120" rx="105" ry="26"/><text class="ucid" x="400" y="113" text-anchor="middle">UC-01</text><text class="ucname" x="400" y="130" text-anchor="middle">Set up project &amp; team</text>
  <ellipse class="uc" cx="400" cy="185" rx="105" ry="26"/><text class="ucid" x="400" y="178" text-anchor="middle">UC-03</text><text class="ucname" x="400" y="195" text-anchor="middle">Approve plan version</text>
  <ellipse class="uc" cx="400" cy="250" rx="105" ry="26"/><text class="ucid" x="400" y="243" text-anchor="middle">UC-13</text><text class="ucname" x="400" y="260" text-anchor="middle">Resolve escalation</text>
  <ellipse class="uc" cx="400" cy="315" rx="105" ry="26"/><text class="ucid" x="400" y="308" text-anchor="middle">UC-14</text><text class="ucname" x="400" y="325" text-anchor="middle">Monitor work &amp; audit</text>
  <ellipse class="uc" cx="400" cy="425" rx="105" ry="26"/><text class="ucid" x="400" y="418" text-anchor="middle">UC-02</text><text class="ucname" x="400" y="435" text-anchor="middle">Connect coding agent</text>
  <ellipse class="uc" cx="400" cy="485" rx="105" ry="26"/><text class="ucid" x="400" y="478" text-anchor="middle">UC-07</text><text class="ucname" x="400" y="495" text-anchor="middle">Check in</text>
  <ellipse class="uc" cx="400" cy="545" rx="105" ry="26"/><text class="ucid" x="400" y="538" text-anchor="middle">UC-04</text><text class="ucname" x="400" y="555" text-anchor="middle">Submit claim</text>
  <ellipse class="uc" cx="400" cy="605" rx="105" ry="26"/><text class="ucid" x="400" y="598" text-anchor="middle">UC-06</text><text class="ucname" x="400" y="615" text-anchor="middle">Revise or withdraw claim</text>
  <ellipse class="uc" cx="400" cy="665" rx="105" ry="26"/><text class="ucid" x="400" y="658" text-anchor="middle">UC-09</text><text class="ucname" x="400" y="675" text-anchor="middle">Acknowledge directive</text>
  <ellipse class="uc" cx="400" cy="725" rx="105" ry="26"/><text class="ucid" x="400" y="718" text-anchor="middle">UC-16</text><text class="ucname" x="400" y="735" text-anchor="middle">Gate push on directives</text>
  <ellipse class="int" cx="400" cy="845" rx="105" ry="26"/><text class="ucid" x="400" y="838" text-anchor="middle">UC-15</text><text class="ucname" x="400" y="855" text-anchor="middle">Mark stale &amp; reconcile</text>

  <!-- use cases: column B -->
  <ellipse class="int" cx="700" cy="185" rx="105" ry="26"/><text class="ucid" x="700" y="178" text-anchor="middle">UC-08</text><text class="ucname" x="700" y="195" text-anchor="middle">Propagate plan change</text>
  <ellipse class="int" cx="700" cy="560" rx="105" ry="26"/><text class="ucid" x="700" y="553" text-anchor="middle">UC-05</text><text class="ucname" x="700" y="570" text-anchor="middle">Check claim</text>
  <ellipse class="int" cx="700" cy="680" rx="105" ry="26"/><text class="ucid" x="700" y="673" text-anchor="middle">UC-12</text><text class="ucname" x="700" y="690" text-anchor="middle">Escalate to lead</text>
  <ellipse class="uc" cx="700" cy="845" rx="105" ry="26"/><text class="ucid" x="700" y="838" text-anchor="middle">UC-10</text><text class="ucname" x="700" y="855" text-anchor="middle">Verify pushed commit</text>
  <ellipse class="int" cx="700" cy="930" rx="105" ry="26"/><text class="ucid" x="700" y="923" text-anchor="middle">UC-11</text><text class="ucname" x="700" y="940" text-anchor="middle">Publish verify check</text>

  <!-- actors -->
  <g transform="translate(100,175)"><circle class="fig" cx="0" cy="0" r="11"/><path class="fig" d="M0,11 V42 M-18,22 H18 M0,42 L-15,66 M0,42 L15,66"/><text class="alabel" x="0" y="86" text-anchor="middle">Integration Lead</text></g>
  <g transform="translate(100,420)"><circle class="fig" cx="0" cy="0" r="11"/><path class="fig" d="M0,11 V42 M-18,22 H18 M0,42 L-15,66 M0,42 L15,66"/><text class="alabel" x="0" y="86" text-anchor="middle">Developer</text></g>
  <g transform="translate(100,600)"><circle class="fig" cx="0" cy="0" r="11"/><path class="fig" d="M0,11 V42 M-18,22 H18 M0,42 L-15,66 M0,42 L15,66"/><text class="alabel" x="0" y="86" text-anchor="middle">Coding Agent</text><text class="stereo" x="0" y="100" text-anchor="middle">via MCP adapter</text></g>
  <g transform="translate(1010,665)"><circle class="fig" cx="0" cy="0" r="11"/><path class="fig" d="M0,11 V42 M-18,22 H18 M0,42 L-15,66 M0,42 L15,66"/><text class="alabel" x="0" y="86" text-anchor="middle">AI Reviewer</text><text class="stereo" x="0" y="100" text-anchor="middle">«system» Bedrock</text></g>
  <g transform="translate(1010,855)"><circle class="fig" cx="0" cy="0" r="11"/><path class="fig" d="M0,11 V42 M-18,22 H18 M0,42 L-15,66 M0,42 L15,66"/><text class="alabel" x="0" y="86" text-anchor="middle">GitHub</text><text class="stereo" x="0" y="100" text-anchor="middle">«system» App + Actions</text></g>
</svg>
